name: Link check

on:
  push:
    branches: [feature/v4-rewrite]
    paths:
      - 'guide/**'
      - 'src/**'
      - 'lib/**'
      - '.github/workflows/linkcheck.yml'
      - 'lychee.toml'
  pull_request:
    branches: [master]
  schedule:
    # Weekly external-link rot check (Mondays 06:00 UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # Build uses an empty basePath (prod shape), so internal links are
          # root-relative (/docs/...); --root-dir resolves them against out/.
          # External URLs get checked too; github.com uses the token path.
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}/out
            './out/**/*.html'
          fail: ${{ github.event_name == 'pull_request' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lychee-report
          path: out/lychee-report.md
          if-no-files-found: ignore
