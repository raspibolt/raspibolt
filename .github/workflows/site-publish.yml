name: Publish site (staging)

# Fires on pushes to feature/v4-rewrite and deploys to the fork's
# GitHub Pages at the custom domain https://next.raspibolt.org.
#
# This is a 1:1 rehearsal of the production deploy (site-publish-prod.yml):
# same official actions/deploy-pages mechanism, same empty basePath
# (served at a domain root, not /RaspiBolt), same custom-domain-via-Settings
# flow. The ONLY differences from prod are the trigger branch and the
# NEXT_PUBLIC_SITE_URL value below. Because that URL is not raspibolt.org,
# isProductionSite stays false -> the build ships noindex + a Disallow-all
# robots.txt + staging analytics, so this mirror never competes with prod.
#
# Master is intentionally excluded; the fork's master still serves the v3
# Jekyll site, and prod deploys run from the upstream repo.
on:
  push:
    branches: [feature/v4-rewrite]
    paths:
      - 'guide/**'
      - 'src/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'source.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'eslint.config.mjs'
      - 'scripts/post-build.mjs'
      - '.github/workflows/site-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment to the Pages environment; don't cancel a
# run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Guard so this staging deploy can only ever run on the fork.
    if: github.repository == 'Stadicus/RaspiBolt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # No NEXT_PUBLIC_BASE_PATH: served at the domain root, so links and
        # assets are root-relative (/docs/..., /images/...) just like prod.
        env:
          NEXT_PUBLIC_SITE_URL: https://next.raspibolt.org
        run: npm run build

      # Gate the deploy on internal links. With an empty basePath the built
      # links are root-relative (/foo), so lychee resolves them against
      # --root-dir = out/ directly; no staging-directory trick needed.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml
            --root-dir ${{ github.workspace }}/out
            'out/**/*.html'
          fail: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
