StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = RaspiBolt

# Core options (must appear before [section] blocks)
IgnoredScopes = code, tt, math, script, style, comment, link

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, RaspiBolt
# Ignore inline code, %scope.key% version tokens, and JSX tags
TokenIgnores = (`[^`]+`), (%[a-z]+\.[A-Za-z0-9_]+%), (<[^>]+>)
